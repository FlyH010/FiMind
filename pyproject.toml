[project]

name = "flyh-mini-mind"

version = "0.1.0"

description = "This is my first hand-coded llm"

readme = "README.md"

requires-python = ">=3.12,<3.13"

dependencies = [
    "numpy==2.5.5",
    "pandas==3.1.1",
    "torch==2.14.1+cu130",
    "transformers==5.24.0"
]

[tool.uv]
package = false

[tool.uv.sources]
torch = {index = "pytorch-cu130"}

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true